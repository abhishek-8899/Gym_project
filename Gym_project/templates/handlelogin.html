{% extends "base.html" %}
{% block title %}
Login
{% endblock title %}

{% block head %}
<style>
.no-spinner::-webkit-outer-spin-button,
.no-spinner::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
.no-spinner {
    -moz-appearance: textfield;
}
</style>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center mb-4">Login</h1>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

                    <form action="/login" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="number" class="form-control no-spinner" name="usernumber" placeholder="Phone Number" required>
                        </div>
                        
                        <div class="mb-3">
                            <input type="password" class="form-control" name="pass1" placeholder="Password" required>
                        </div>
                        
                        <div class="d-grid">
                            <button class="btn btn-warning" type="submit">Login</button>
                        </div>
                    </form>
                    <p class="text-center mt-3">Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock head %}
